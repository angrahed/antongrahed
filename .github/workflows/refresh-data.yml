# Refreshes the committed World Bank and GitHub snapshots in src/data/generated/ and opens
# a pull request when anything changed. The script only rewrites a file when its payload
# changed, so quiet weeks produce no PR.
#
# Requires the repository setting
#   Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
# otherwise `gh pr create` fails with a permissions error.
name: refresh-data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh data snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch World Bank and GitHub data
        run: node scripts/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open a pull request if the snapshots changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/data/generated)" ]; then
            echo "Snapshots unchanged."
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/generated
          git commit -m "Refresh World Bank and GitHub data snapshots"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --fill
